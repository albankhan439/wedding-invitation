<!DOCTYPE html>
<html lang="en">
 
<head>
 
    <meta charset="UTF-8">
 
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
 
    <title>Walima Admin Panel</title>
 
    <link rel="stylesheet" href="admin.css">
 
    <link rel="preconnect" href="https://fonts.googleapis.com">
 
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">
 
</head>
 
<body>
 
    <div class="container">
 
        <div class="card">
 
    <h1>🌿 Walima Admin Panel</h1>
 
    <p>Guest Management System</p>
 
    <div class="form-grid">
 
        <div class="form-group">
 
            <label>Guest Name</label>
 
            <input
                type="text"
                id="guestName"
                placeholder="Enter Guest Name">
 
        </div>
 
        <div class="form-group">
 
            <label>Mobile Number</label>
 
            <input
                type="tel"
                id="guestMobile"
                placeholder="9876543210">
 
        </div>
 
    </div>
 
    <div class="buttons">
 
        <button id="addGuestBtn">
 
            ➕ Add Guest
 
        </button>
 
        <button id="updateGuestBtn">
 
            ✏️ Update Guest
 
        </button>
 
    </div>
 
    <hr>
 
    <div class="form-group">
 
        <label>
 
            Search Guest
 
        </label>
 
        <input
            type="text"
            id="searchGuest"
            placeholder="Search by Name">
 
    </div>
 <div class="stats">
 
    <div class="stat-card">
 
        <h2 id="totalGuests">0</h2>
 
        <p>Total Guests</p>
 
    </div>
 
</div>
 
<div class="buttons">
 
    <button onclick="exportCSV()">
 
        📥 Export CSV
 
    </button>
 
</div>
    <table id="guestTable">
 
        <thead>
 
            <tr>
 
                <th>Name</th>
 
                <th>Mobile</th>
 
                <th>Invitation</th>
 
                <th>WhatsApp</th>
 
                <th>Edit</th>
 
                <th>Delete</th>
 
            </tr>
 
        </thead>
 
        <tbody>
 
        </tbody>
 
    </table>
 
</div>
 
    </div>
 
    <script src="admin.js"></script>
 
</body>
 
</html>
